name: Build Pong XNU on macOS

on:
  workflow_dispatch:
    inputs:
      diagnostic_v8:
        description: Build an isolated source-CoreCrypto bootstrap kernel with UFS and Pong GPU disabled
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pong-xnu-macos-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out UniXNU core
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu
          submodules: recursive
          persist-credentials: false

      - name: Check out Pong device repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: device
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            developer=/Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode.app ]; then
            developer=/Applications/Xcode.app
          else
            developer=$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort | tail -n 1)
          fi
          test -n "$developer"
          echo "DEVELOPER_DIR=$developer/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $developer"

      - name: Check runner
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find mig
          sw_vers
          uname -m
          df -h "$GITHUB_WORKSPACE"

      - name: Install build tools
        run: brew install llvm lld mtools dtc unifdef ripgrep

      - name: Check required firmware secret
        if: ${{ inputs.diagnostic_v8 != true }}
        env:
          FIRMWARE_URL: ${{ secrets.PONG_FIRMWARE_URL }}
          FIRMWARE_SHA256: ${{ secrets.PONG_FIRMWARE_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$FIRMWARE_URL" || { echo 'Missing secret PONG_FIRMWARE_URL' >&2; exit 1; }
          test -n "$FIRMWARE_SHA256" || { echo 'Missing secret PONG_FIRMWARE_SHA256' >&2; exit 1; }
          echo 'Pong GPU firmware secrets are present.'

      - name: Select Pong configuration
        working-directory: unixnu
        run: ./unixnu defconfig pong_defconfig -D "$GITHUB_WORKSPACE/device"

      - name: Fetch pinned source repositories
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./unixnu fetch
          ./unixnu fetch IOStorageFamily
          ./unixnu tree

      - name: Prepare public storage headers
        working-directory: unixnu
        run: |
          set -euo pipefail
          storage=$(find "$GITHUB_WORKSPACE/unixnu/out/feeds" -maxdepth 1 \
            -type d -name 'IOStorageFamily-*' -print -quit)
          test -n "$storage"
          ln -s "$storage" "$GITHUB_WORKSPACE/unixnu/out/pong/tree/refer/IOStorageFamily"
          cd "$GITHUB_WORKSPACE/unixnu/out/pong/tree"
          python3 scripts/prepare-storage-headers.py

      - name: Fetch iOS 16.6.1 inputs
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python3 "$GITHUB_WORKSPACE/device/scripts/fetch-ios16-assets.py"; then
              exit 0
            fi
            sleep 20
          done
          exit 1

      - name: Download Pong GPU firmware
        if: ${{ inputs.diagnostic_v8 != true }}
        env:
          FIRMWARE_URL: ${{ secrets.PONG_FIRMWARE_URL }}
          FIRMWARE_SHA256: ${{ secrets.PONG_FIRMWARE_SHA256 }}
        run: |
          set -euo pipefail
          echo '::add-mask::'"$FIRMWARE_URL"
          archive="$RUNNER_TEMP/pong-gpu-firmware.tar.gz"
          curl -fL --retry 3 --retry-all-errors "$FIRMWARE_URL" | base64 -D > "$archive"
          printf '%s  %s\n' "$FIRMWARE_SHA256" "$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/pong-firmware"
          tar -xzf "$archive" -C "$RUNNER_TEMP/pong-firmware"
          gpu="$RUNNER_TEMP/pong-firmware/gpu"
          test -f "$gpu/gmu_gen70000.bin"
          test -f "$gpu/a730_sqe.fw"
          test -f "$gpu/a730_zap.mdt"
          test -f "$gpu/a730_zap.b01"
          test -f "$gpu/a730_zap.b02"

      - name: Fetch Darwin 22 storage reference
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/IOStorageFamily-ios16"
          git init -q "$source"
          git -C "$source" remote add origin https://github.com/apple-oss-distributions/IOStorageFamily.git
          git -C "$source" fetch -q --depth 1 origin 609cbbdf9fa8fd5eae973d9135c7d44b47e6502e
          git -C "$source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$source" rev-parse HEAD)" = 609cbbdf9fa8fd5eae973d9135c7d44b47e6502e

      - name: Build storage ABI bootstrap kernel
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PONG_ADRENO_FIRMWARE_DIR: ${{ runner.temp }}/pong-firmware/gpu
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/device/mac-build/ios16-xnu-pong-bootstrap"
          python3 "$GITHUB_WORKSPACE/device/scripts/build-ios16-pong-macos.py" \
            --baseline-tree "$GITHUB_WORKSPACE/unixnu/out/pong/tree" \
            --tree "$RUNNER_TEMP/pong-bootstrap/tree" \
            --developer-dir "$DEVELOPER_DIR" \
            --jobs 4 \
            --artifact-dir "$GITHUB_WORKSPACE/device/mac-build/ios16-xnu-pong-bootstrap" \
            --bootstrap-storage-abi

      - name: Build source CoreCrypto archives for v8
        if: ${{ inputs.diagnostic_v8 == true }}
        working-directory: ${{ runner.temp }}/pong-bootstrap/tree
        run: |
          set -euo pipefail
          python3 scripts/build-corecrypto-14.py
          python3 scripts/build-corecrypto-14.py --namespace
          ls -lh build/corecrypto-2023/libcorecrypto_kernel_noasm*.a

      - name: Emit corecrypto ABI candidate
        if: ${{ inputs.diagnostic_v8 != true }}
        working-directory: unixnu
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/build/native-xnu-probe-continue-policy"
          python3 "$GITHUB_WORKSPACE/device/scripts/build-ios16-corecrypto-candidate.py" \
            --native-artifact "$GITHUB_WORKSPACE/device/mac-build/ios16-xnu-pong-bootstrap" \
            --kernelcache "$GITHUB_WORKSPACE/unixnu/out/ipsw/20G81/kernelcache.release.ipad7" \
            --output-dir "$GITHUB_WORKSPACE/build/native-xnu-probe-continue-policy" \
            --module com.apple.iokit.IOStorageFamily \
            --skip-bootimg

      - name: Audit iOS 16 storage ABI
        if: ${{ inputs.diagnostic_v8 != true }}
        working-directory: unixnu
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/device/mac-build/storage-abi"
          python3 "$GITHUB_WORKSPACE/device/scripts/audit-ios16-storage-abi.py" \
            --source "$RUNNER_TEMP/IOStorageFamily-ios16" \
            --candidate "$GITHUB_WORKSPACE/build/native-xnu-probe-continue-policy/kernel-corecrypto.macho" \
            --framework "$RUNNER_TEMP/pong-bootstrap/tree/.cache/fakeroot/System/Library/Frameworks/Kernel.framework/Versions/A" \
            --developer-dir "$DEVELOPER_DIR" \
            --output-dir "$GITHUB_WORKSPACE/device/mac-build/storage-abi"
          rm -rf "$GITHUB_WORKSPACE/unixnu/out/pong/tree/build/storage-abi"
          cp -R "$GITHUB_WORKSPACE/device/mac-build/storage-abi" \
            "$GITHUB_WORKSPACE/unixnu/out/pong/tree/build/storage-abi"

      - name: Build Pong kernel from a fresh macOS tree
        working-directory: unixnu
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PONG_ADRENO_FIRMWARE_DIR: ${{ runner.temp }}/pong-firmware/gpu
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifact/kernel"
          args=(
            --baseline-tree "$GITHUB_WORKSPACE/unixnu/out/pong/tree"
            --tree "$RUNNER_TEMP/pong-native/tree"
            --developer-dir "$DEVELOPER_DIR"
            --jobs 4
            --artifact-dir "$GITHUB_WORKSPACE/artifact/kernel"
          )
          if [[ "${{ inputs.diagnostic_v8 }}" == "true" ]]; then
            python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["GITHUB_WORKSPACE"]) / "device/configs/pong_defconfig"
          text = path.read_text()
          changes = {
              'CONFIG_XNU_CRYPTO_BOOTSTRAP="prelinked"': 'CONFIG_XNU_CRYPTO_BOOTSTRAP="source"',
              'CONFIG_XNU_PONG_ADRENO_PLATFORM=y': 'CONFIG_XNU_PONG_ADRENO_PLATFORM=n',
              'CONFIG_XNU_SOURCE_CORECRYPTO14=n': 'CONFIG_XNU_SOURCE_CORECRYPTO14=y',
          }
          for old, new in changes.items():
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one {old!r} in {path}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
            args+=(--bootstrap-storage-abi)
            python3 "$GITHUB_WORKSPACE/device/scripts/build-ios16-pong-macos.py" "${args[@]}" --prepare-only
            mkdir -p "$RUNNER_TEMP/pong-native/tree/build/corecrypto-2023"
            cp "$RUNNER_TEMP/pong-bootstrap/tree/build/corecrypto-2023/libcorecrypto_kernel_noasm-namespaced.a" \
              "$RUNNER_TEMP/pong-native/tree/build/corecrypto-2023/"
            python3 "$GITHUB_WORKSPACE/device/scripts/build-ios16-pong-macos.py" "${args[@]}"
          else
            args+=(--skip-image-verification)
            python3 "$GITHUB_WORKSPACE/device/scripts/build-ios16-pong-macos.py" "${args[@]}"
          fi

      - name: Stage reports and hashes
        if: always()
        run: |
          set -euo pipefail
          native_tree="$RUNNER_TEMP/pong-native/tree"
          native_kernel="$native_tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_PONG/mach.development.pong.unstripped"
          mkdir -p "$GITHUB_WORKSPACE/artifact/symbols"
          if [ -f "$native_kernel" ]; then
            cp "$native_kernel" \
              "$GITHUB_WORKSPACE/artifact/symbols/mach.development.pong.unstripped"
            nm -nm -arch arm64 "$native_kernel" \
              > "$GITHUB_WORKSPACE/artifact/symbols/mach.development.pong.nm.txt" || true
            otool -l "$native_kernel" \
              > "$GITHUB_WORKSPACE/artifact/symbols/mach.development.pong.otool.txt" || true
          fi
          find "$native_tree/build" -type f \( -name '*.map' -o -name '*.unstripped*' \) \
            -print 2>/dev/null | sort > "$GITHUB_WORKSPACE/artifact/symbols/build-symbol-files.txt" || true
          mkdir -p "$GITHUB_WORKSPACE/artifact/reports"
          for path in \
            "$GITHUB_WORKSPACE/device/mac-build/storage-abi" \
            "$GITHUB_WORKSPACE/device/mac-build/ios16-xnu-pong-bootstrap" \
            "$GITHUB_WORKSPACE/device/mac-build/native-ufs" \
            "$GITHUB_WORKSPACE/device/mac-build/armdt-platform" \
            "$GITHUB_WORKSPACE/device/mac-build/ios16-xnu-pong"; do
            if [ -d "$path" ]; then
              name=$(basename "$path")
              cp -R "$path" "$GITHUB_WORKSPACE/artifact/reports/$name"
            fi
          done
          find "$GITHUB_WORKSPACE/artifact" -type f -print0 | xargs -0 shasum -a 256 \
            > "$GITHUB_WORKSPACE/artifact/SHA256SUMS" || true

      - name: Upload Pong kernel artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pong-xnu-macos-${{ github.run_number }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pong-xnu-macos-logs-${{ github.run_number }}
          path: |
            unixnu/out/pong/logs/*.log
            ${{ runner.temp }}/pong-bootstrap/*.log
            ${{ runner.temp }}/pong-bootstrap/tree/build/**/*.log
            ${{ runner.temp }}/pong-native/*.log
            ${{ runner.temp }}/pong-native/tree/build/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup proprietary inputs
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/pong-firmware" "$RUNNER_TEMP/pong-gpu-firmware.tar.gz"
